<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost OS | Anonymous Social</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --bg: #050505;
            --card: #121212;
            --accent: #ff2d55;
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            overflow: hidden;
            height: 100dvh;
            -webkit-tap-highlight-color: transparent;
        }

        /* Screen Management */
        .screen {
            display: none;
            height: 100%;
            flex-direction: column;
            animation: fadeIn 0.3s ease-out;
        }
        .screen.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Glassmorphism UI */
        .glass { background: rgba(20, 20, 20, 0.7); backdrop-filter: blur(20px); border: 1px solid var(--border); }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 28px; }
        
        /* Message Bubbles */
        .msg-bubble { 
            max-width: 80%; 
            padding: 14px 18px; 
            border-radius: 24px; 
            font-size: 14px; 
            position: relative;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .msg-ghost { filter: blur(10px); cursor: pointer; }
        .msg-ghost.revealed { filter: blur(0); }
        .msg-burned { opacity: 0.2; filter: grayscale(1); pointer-events: none; }

        /* Bottom Nav */
        nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 85px; background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(25px); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; padding-bottom: 20px; z-index: 50;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #444; gap: 4px; transition: 0.3s; }
        .nav-item.active { color: white; }

        /* Hide Scrollbar */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        /* Swipe Animation Visual */
        .swipe-indicator {
            position: absolute; left: -40px; top: 50%; transform: translateY(-50%);
            opacity: 0; transition: 0.2s; color: var(--accent);
        }
    </style>
</head>
<body>

    <!-- SCREEN: HOME -->
    <div id="screen-home" class="screen active p-6 overflow-y-auto pb-32 hide-scroll">
        <header class="mt-8 mb-10">
            <h1 class="text-4xl font-extrabold tracking-tighter italic">GHOST OS</h1>
            <p class="text-white/30 text-xs mt-1 font-bold tracking-widest uppercase" id="user-id-display">Loading Identity...</p>
        </header>

        <div class="grid grid-cols-2 gap-4 mb-12">
            <div onclick="createRoom('private')" class="card p-6 active:scale-95 transition-transform cursor-pointer">
                <i data-lucide="zap" class="text-pink-500 mb-3" fill="currentColor"></i>
                <h3 class="font-bold text-sm">Secret Room</h3>
                <p class="text-[10px] text-white/30 font-black uppercase tracking-wider">Burn on View</p>
            </div>
            <div onclick="createRoom('community')" class="card p-6 active:scale-95 transition-transform cursor-pointer">
                <i data-lucide="flame" class="text-orange-500 mb-3" fill="currentColor"></i>
                <h3 class="font-bold text-sm">Public Vibe</h3>
                <p class="text-[10px] text-white/30 font-black uppercase tracking-wider">Global Chat</p>
            </div>
        </div>

        <h4 class="text-[10px] font-black uppercase tracking-[0.3em] text-white/20 mb-4 px-2">History</h4>
        <div id="history-container" class="space-y-3">
            <!-- Rooms appear here -->
        </div>
    </div>

    <!-- SCREEN: GISTME (SOCIAL) -->
    <div id="screen-gist" class="screen overflow-y-auto pb-32 hide-scroll">
        <header class="sticky top-0 p-6 bg-black/80 backdrop-blur-xl z-10 flex justify-between items-end border-b border-white/5">
            <div>
                <h2 class="text-2xl font-black italic">GistMe</h2>
                <p class="text-[10px] text-white/30 font-black uppercase tracking-widest">Live Threads</p>
            </div>
            <button onclick="openGistModal()" class="w-12 h-12 bg-white text-black rounded-full flex items-center justify-center shadow-2xl active:scale-90 transition-transform">
                <i data-lucide="plus"></i>
            </button>
        </header>

        <div id="gist-feed" class="p-4 space-y-6">
            <!-- Gist posts appear here -->
        </div>
    </div>

    <!-- SCREEN: CHAT -->
    <div id="screen-chat" class="screen">
        <header class="p-6 flex items-center justify-between border-b border-white/5 bg-black/50 backdrop-blur-lg">
            <button onclick="changeScreen('home')" class="text-white/30"><i data-lucide="chevron-left"></i></button>
            <div class="text-center">
                <p class="text-[10px] font-black text-pink-500 uppercase tracking-[0.2em]" id="chat-title">Whisper Room</p>
                <p class="text-[9px] text-white/20 font-bold" id="chat-subtitle">#000000</p>
            </div>
            <button onclick="copyLink()" class="p-3 bg-white/5 rounded-2xl border border-white/10"><i data-lucide="copy" size="16"></i></button>
        </header>

        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-6 hide-scroll">
            <!-- Messages appear here -->
        </div>

        <!-- Reply Preview -->
        <div id="reply-preview" class="hidden px-4 py-2 bg-white/5 border-t border-white/5 flex justify-between items-center">
            <div class="flex items-center gap-2 overflow-hidden">
                <i data-lucide="corner-up-left" size="14" class="text-pink-500"></i>
                <p class="text-[10px] text-white/40 truncate italic" id="reply-text"></p>
            </div>
            <button onclick="cancelReply()"><i data-lucide="x" size="14"></i></button>
        </div>

        <div class="p-4 pb-10 bg-black">
            <form id="chat-form" class="flex items-end gap-2 p-2 bg-white/5 border border-white/10 rounded-[35px] focus-within:border-white/20 transition-all">
                <button type="button" id="btn-ghost" onclick="toggleGhostMode()" class="w-12 h-12 rounded-full flex items-center justify-center transition-all text-white/20">
                    <i data-lucide="ghost"></i>
                </button>
                <textarea id="chat-input" rows="1" class="flex-1 bg-transparent py-3 px-2 text-sm outline-none resize-none placeholder:text-white/10" placeholder="Whisper something..."></textarea>
                <button type="submit" class="w-12 h-12 bg-white text-black rounded-full flex items-center justify-center active:scale-90 transition-transform">
                    <i data-lucide="send" size="20" fill="currentColor"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL: NEW GIST -->
    <div id="modal-gist" class="fixed inset-0 z-[100] bg-black/95 backdrop-blur-xl p-6 hidden flex-col items-center justify-center">
        <div class="w-full max-w-sm card p-8 relative">
            <button onclick="closeGistModal()" class="absolute top-6 right-6 text-white/20"><i data-lucide="x"></i></button>
            <h2 class="text-2xl font-black mb-6 italic">New Gist</h2>
            <textarea id="gist-text-input" class="w-full h-32 bg-transparent text-white outline-none text-lg placeholder:text-white/10 resize-none mb-6" placeholder="What's the tea?"></textarea>
            
            <div id="gist-img-preview-container" class="hidden mb-6 relative">
                <img id="gist-img-preview" class="w-full h-40 object-cover rounded-2xl border border-white/10">
                <button onclick="clearGistImage()" class="absolute top-2 right-2 p-2 bg-black/60 rounded-full"><i data-lucide="x" size="12"></i></button>
            </div>

            <button onclick="document.getElementById('gist-file-input').click()" class="w-full h-14 rounded-2xl bg-white/5 border border-dashed border-white/20 flex items-center justify-center gap-3 text-[10px] font-black uppercase tracking-widest text-white/40 mb-4">
                <i data-lucide="camera" size="18"></i> Add Photo
            </button>
            <input type="file" id="gist-file-input" class="hidden" accept="image/*" onchange="previewGistImage(this)">

            <button onclick="submitGist()" class="w-full h-14 bg-white text-black rounded-2xl font-black text-sm active:scale-95 transition-transform">POST THREAD</button>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav id="bottom-nav">
        <div onclick="changeScreen('home')" id="nav-home" class="nav-item active">
            <i data-lucide="message-square"></i>
            <span class="text-[8px] font-black uppercase tracking-widest">Rooms</span>
        </div>
        <div onclick="changeScreen('gist')" id="nav-gist" class="nav-item">
            <i data-lucide="flame"></i>
            <span class="text-[8px] font-black uppercase tracking-widest">GistMe</span>
        </div>
    </nav>

    <!-- FIREBASE & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, addDoc, onSnapshot, serverTimestamp, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Config
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'ghost-os-html';

        // State
        let user = null;
        let currentRoomId = null;
        let isGhostMode = false;
        let replyingTo = null;
        let pendingImage = null;

        // Init Lucide Icons
        lucide.createIcons();

        // Auth
        onAuthStateChanged(auth, (u) => {
            if (u) {
                user = u;
                document.getElementById('user-id-display').textContent = `Anon Identity: ${u.uid.substring(0,8)}`;
                loadHistory();
                loadGists();
                checkHash();
            } else {
                signInAnonymously(auth);
            }
        });

        // Routing
        window.checkHash = () => {
            const hash = window.location.hash.slice(1);
            if (hash) {
                initChat(hash);
            } else {
                changeScreen('home');
            }
        };
        window.onhashchange = checkHash;

        window.changeScreen = (name) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${name}`).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(`nav-${name}`)?.classList.add('active');
            
            // Toggle nav
            document.getElementById('bottom-nav').style.display = name === 'chat' ? 'none' : 'flex';
        };

        // ROOMS
        window.createRoom = async (type) => {
            const id = type === 'community' ? 'community' : Math.random().toString(36).substring(2, 10);
            const expires = Date.now() + (24 * 60 * 60 * 1000);
            
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', id), {
                type, expires: serverTimestamp(), createdAt: serverTimestamp()
            });

            await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'history', id), {
                roomId: id, type, timestamp: Date.now()
            });

            window.location.hash = id;
        };

        function loadHistory() {
            const col = collection(db, 'artifacts', appId, 'users', user.uid, 'history');
            onSnapshot(col, (snap) => {
                const container = document.getElementById('history-container');
                container.innerHTML = '';
                snap.docs.sort((a,b) => b.data().timestamp - a.data().timestamp).forEach(d => {
                    const data = d.data();
                    const el = document.createElement('div');
                    el.className = 'card p-5 flex justify-between items-center active:bg-white/5';
                    el.onclick = () => window.location.hash = data.roomId;
                    el.innerHTML = `
                        <div class="flex items-center gap-4">
                            <div class="w-2 h-2 rounded-full ${data.type === 'private' ? 'bg-pink-500 shadow-[0_0_8px_#ff2d55]' : 'bg-orange-500'}"></div>
                            <div>
                                <div class="font-bold text-sm">Room #${data.roomId}</div>
                                <div class="text-[10px] text-white/20 uppercase font-black">${data.type}</div>
                            </div>
                        </div>
                        <i data-lucide="chevron-right" size="16" class="text-white/10"></i>
                    `;
                    container.appendChild(el);
                    lucide.createIcons();
                });
                if (snap.empty) container.innerHTML = '<p class="text-center py-10 text-white/10 text-xs italic">No hauntings recorded.</p>';
            });
        }

        // CHAT
        let unsubChat = null;
        async function initChat(roomId) {
            currentRoomId = roomId;
            changeScreen('chat');
            document.getElementById('chat-subtitle').textContent = `#${roomId}`;
            
            const col = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId, 'messages');
            if (unsubChat) unsubChat();
            
            unsubChat = onSnapshot(col, (snap) => {
                const container = document.getElementById('chat-messages');
                container.innerHTML = '';
                const msgs = snap.docs.map(d => ({id: d.id, ...d.data()}))
                    .sort((a,b) => (a.createdAt?.toMillis() || 0) - (b.createdAt?.toMillis() || 0));
                
                msgs.forEach(m => {
                    const isMe = m.sender === user.uid;
                    const isBurned = m.isGhost && m.viewedBy?.includes(user.uid);
                    
                    const div = document.createElement('div');
                    div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} group`;
                    
                    // Swipe handler (Simple click for reply on desktop, swipe handled via JS)
                    div.onclick = () => handleReply(m);

                    let replyHtml = m.replyTo ? `<div class="text-[9px] text-white/20 mb-1 px-2 italic">Replying to: ${m.replyTo.text.substring(0,15)}...</div>` : '';
                    
                    div.innerHTML = `
                        ${replyHtml}
                        <div id="msg-${m.id}" class="msg-bubble ${isMe ? 'bg-pink-600 rounded-br-none' : 'bg-white/5 border border-white/10 rounded-bl-none'} 
                             ${m.isGhost && !isBurned ? 'msg-ghost' : ''} ${isBurned ? 'msg-burned' : ''}">
                            ${isBurned ? 'VOICE VANISHED' : m.text}
                            ${m.isGhost && !isBurned ? '<div class="absolute inset-0 flex items-center justify-center opacity-30"><i data-lucide="ghost" size="14"></i></div>' : ''}
                        </div>
                    `;
                    
                    if (m.isGhost && !isBurned) {
                        div.querySelector('.msg-bubble').onclick = (e) => {
                            e.stopPropagation();
                            revealGhost(m);
                        };
                    }

                    container.appendChild(div);
                });
                lucide.createIcons();
                container.scrollTop = container.scrollHeight;
            });
        }

        async function revealGhost(msg) {
            const el = document.getElementById(`msg-${msg.id}`);
            el.classList.add('revealed');
            
            const viewedBy = msg.viewedBy || [];
            if (!viewedBy.includes(user.uid)) {
                viewedBy.push(user.uid);
                const ref = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId, 'messages', msg.id);
                await updateDoc(ref, { viewedBy });
            }
        }

        window.toggleGhostMode = () => {
            isGhostMode = !isGhostMode;
            const btn = document.getElementById('btn-ghost');
            btn.classList.toggle('text-pink-500', isGhostMode);
            btn.classList.toggle('text-white/20', !isGhostMode);
            btn.classList.toggle('bg-pink-600/10', isGhostMode);
        };

        function handleReply(msg) {
            replyingTo = msg;
            document.getElementById('reply-text').textContent = msg.text;
            document.getElementById('reply-preview').classList.remove('hidden');
            document.getElementById('chat-input').focus();
        }

        window.cancelReply = () => {
            replyingTo = null;
            document.getElementById('reply-preview').classList.add('hidden');
        };

        document.getElementById('chat-form').onsubmit = async (e) => {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            const col = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId, 'messages');
            await addDoc(col, {
                text, sender: user.uid, createdAt: serverTimestamp(),
                isGhost: isGhostMode, viewedBy: [],
                replyTo: replyingTo ? { id: replyingTo.id, text: replyingTo.text } : null
            });

            input.value = '';
            cancelReply();
            if (isGhostMode) toggleGhostMode();
        };

        // GISTME
        window.openGistModal = () => document.getElementById('modal-gist').classList.remove('hidden');
        window.closeGistModal = () => document.getElementById('modal-gist').classList.add('hidden');

        window.previewGistImage = (input) => {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    pendingImage = e.target.result;
                    document.getElementById('gist-img-preview').src = pendingImage;
                    document.getElementById('gist-img-preview-container').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        window.clearGistImage = () => {
            pendingImage = null;
            document.getElementById('gist-img-preview-container').classList.add('hidden');
            document.getElementById('gist-file-input').value = '';
        };

        window.submitGist = async () => {
            const textInput = document.getElementById('gist-text-input');
            const text = textInput.value.trim();
            if (!text && !pendingImage) return;

            const col = collection(db, 'artifacts', appId, 'public', 'data', 'gists');
            await addDoc(col, {
                text, image: pendingImage, sender: user.uid,
                createdAt: serverTimestamp(), likes: 0
            });

            textInput.value = '';
            clearGistImage();
            closeGistModal();
        };

        function loadGists() {
            const col = collection(db, 'artifacts', appId, 'public', 'data', 'gists');
            onSnapshot(col, (snap) => {
                const container = document.getElementById('gist-feed');
                container.innerHTML = '';
                const items = snap.docs.map(d => d.data()).sort((a,b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                
                items.forEach(g => {
                    const el = document.createElement('div');
                    el.className = 'card p-6';
                    el.innerHTML = `
                        <div class="flex items-center gap-3 mb-4">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-pink-500 to-indigo-600"></div>
                            <div class="text-[10px] font-black uppercase text-white/40 tracking-widest">ghost_${g.sender?.substring(0,5)}</div>
                        </div>
                        <p class="text-sm text-white/80 leading-relaxed mb-4 font-medium">${g.text}</p>
                        ${g.image ? `<img src="${g.image}" class="w-full h-auto rounded-2xl border border-white/10 mb-4">` : ''}
                        <div class="flex gap-4">
                            <button class="text-white/20 flex items-center gap-1.5"><i data-lucide="flame" size="14"></i> <span class="text-[9px] font-black">${g.likes || 0}</span></button>
                            <button class="text-white/20 flex items-center gap-1.5"><i data-lucide="message-square" size="14"></i> <span class="text-[9px] font-black uppercase">REPLY</span></button>
                        </div>
                    `;
                    container.appendChild(el);
                });
                lucide.createIcons();
            });
        }

        window.copyLink = () => {
            const dummy = document.createElement('textarea');
            dummy.value = window.location.href;
            document.body.appendChild(dummy);
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);
            alert('Secret link copied!');
        };
    </script>
</body>
</html>
