
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost OS | Anonymous Social</title>
    
    <!-- Tailwind CSS (Development CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --bg: #050505;
            --card: #121212;
            --accent: #ff2d55;
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            overflow: hidden;
            height: 100dvh;
            -webkit-tap-highlight-color: transparent;
        }

        .screen { display: none; height: 100%; flex-direction: column; animation: fadeIn 0.3s ease-out; }
        .screen.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: 28px; transition: transform 0.2s; }
        .card:active { transform: scale(0.95); }
        
        .msg-bubble { max-width: 80%; padding: 14px 18px; border-radius: 24px; font-size: 14px; position: relative; }
        .msg-ghost { filter: blur(10px); cursor: pointer; }
        .msg-ghost.revealed { filter: blur(0); }
        .msg-burned { opacity: 0.2; filter: grayscale(1); pointer-events: none; }

        nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 85px; background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(25px); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; padding-bottom: 20px; z-index: 50;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #444; gap: 4px; transition: 0.3s; cursor: pointer; }
        .nav-item.active { color: white; }

        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <script>
        /**
         * GLOBAL FUNCTION DEFINITIONS
         * Defined here so HTML buttons can access them immediately
         */
        window.changeScreen = (name) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${name}`).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            const navBtn = document.getElementById(`nav-${name}`);
            if(navBtn) navBtn.classList.add('active');
            
            const bottomNav = document.getElementById('bottom-nav');
            if(bottomNav) bottomNav.style.display = name === 'chat' ? 'none' : 'flex';
        };

        window.openGistModal = () => document.getElementById('modal-gist')?.classList.remove('hidden');
        window.closeGistModal = () => document.getElementById('modal-gist')?.classList.add('hidden');
    </script>
</head>
<body>

    <!-- HOME -->
    <div id="screen-home" class="screen active p-6 overflow-y-auto pb-32 hide-scroll">
        <header class="mt-8 mb-10">
            <h1 class="text-4xl font-extrabold tracking-tighter italic">GHOST OS</h1>
            <p class="text-white/30 text-[10px] mt-1 font-bold tracking-widest uppercase" id="user-id-display">Syncing with Void...</p>
        </header>

        <div class="grid grid-cols-2 gap-4 mb-12">
            <div id="btn-create-private" class="card p-6 cursor-pointer">
                <i data-lucide="zap" class="text-pink-500 mb-3" fill="currentColor"></i>
                <h3 class="font-bold text-sm">Secret Room</h3>
                <p class="text-[10px] text-white/30 font-black uppercase tracking-wider">Burn on View</p>
            </div>
            <div id="btn-create-community" class="card p-6 cursor-pointer">
                <i data-lucide="flame" class="text-orange-500 mb-3" fill="currentColor"></i>
                <h3 class="font-bold text-sm">Public Vibe</h3>
                <p class="text-[10px] text-white/30 font-black uppercase tracking-wider">Global Chat</p>
            </div>
        </div>

        <h4 class="text-[10px] font-black uppercase tracking-[0.3em] text-white/20 mb-4 px-2">History</h4>
        <div id="history-container" class="space-y-3"></div>
    </div>

    <!-- GISTME -->
    <div id="screen-gist" class="screen overflow-y-auto pb-32 hide-scroll">
        <header class="sticky top-0 p-6 bg-black/80 backdrop-blur-xl z-10 flex justify-between items-end border-b border-white/5">
            <div>
                <h2 class="text-2xl font-black italic">GistMe</h2>
                <p class="text-[10px] text-white/30 font-black uppercase tracking-widest">Live Threads</p>
            </div>
            <button onclick="window.openGistModal()" class="w-12 h-12 bg-white text-black rounded-full flex items-center justify-center shadow-2xl">
                <i data-lucide="plus"></i>
            </button>
        </header>
        <div id="gist-feed" class="p-4 space-y-6"></div>
    </div>

    <!-- CHAT -->
    <div id="screen-chat" class="screen">
        <header class="p-6 flex items-center justify-between border-b border-white/5 bg-black/50 backdrop-blur-lg">
            <button onclick="window.location.hash = ''" class="text-white/30"><i data-lucide="chevron-left"></i></button>
            <div class="text-center">
                <p class="text-[10px] font-black text-pink-500 uppercase tracking-[0.2em]" id="chat-title">Whisper Room</p>
                <p class="text-[9px] text-white/20 font-bold" id="chat-subtitle">#000000</p>
            </div>
            <button id="btn-copy-link" class="p-3 bg-white/5 rounded-2xl border border-white/10"><i data-lucide="copy" size="16"></i></button>
        </header>
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-6 hide-scroll"></div>
        <div id="reply-preview" class="hidden px-4 py-2 bg-white/5 border-t border-white/5 flex justify-between items-center text-[10px] text-white/40 italic">
            <span id="reply-text"></span>
            <button id="btn-cancel-reply"><i data-lucide="x" size="14"></i></button>
        </div>
        <div class="p-4 pb-10 bg-black">
            <form id="chat-form" class="flex items-end gap-2 p-2 bg-white/5 border border-white/10 rounded-[35px]">
                <button type="button" id="btn-ghost" class="w-12 h-12 rounded-full flex items-center justify-center text-white/20">
                    <i data-lucide="ghost"></i>
                </button>
                <textarea id="chat-input" rows="1" class="flex-1 bg-transparent py-3 px-2 text-sm outline-none resize-none placeholder:text-white/10" placeholder="Whisper..."></textarea>
                <button type="submit" class="w-12 h-12 bg-white text-black rounded-full flex items-center justify-center"><i data-lucide="send" size="20"></i></button>
            </form>
        </div>
    </div>

    <!-- MODAL -->
    <div id="modal-gist" class="fixed inset-0 z-[100] bg-black/95 backdrop-blur-xl p-6 hidden flex-col items-center justify-center">
        <div class="w-full max-w-sm card p-8 relative">
            <button onclick="window.closeGistModal()" class="absolute top-6 right-6 text-white/20"><i data-lucide="x"></i></button>
            <h2 class="text-2xl font-black mb-6 italic">New Gist</h2>
            <textarea id="gist-text-input" class="w-full h-32 bg-transparent text-white outline-none text-lg resize-none mb-6" placeholder="What's the tea?"></textarea>
            <div id="gist-img-preview-container" class="hidden mb-6 relative">
                <img id="gist-img-preview" class="w-full h-40 object-cover rounded-2xl">
                <button id="btn-clear-img" class="absolute top-2 right-2 p-2 bg-black/60 rounded-full"><i data-lucide="x" size="12"></i></button>
            </div>
            <button id="btn-add-photo" class="w-full h-14 rounded-2xl bg-white/5 border border-dashed border-white/20 flex items-center justify-center gap-3 text-[10px] font-black uppercase text-white/40 mb-4">
                <i data-lucide="camera" size="18"></i> Add Photo
            </button>
            <input type="file" id="gist-file-input" class="hidden" accept="image/*">
            <button id="btn-submit-gist" class="w-full h-14 bg-white text-black rounded-2xl font-black text-sm">POST THREAD</button>
        </div>
    </div>

    <nav id="bottom-nav">
        <div onclick="window.changeScreen('home')" id="nav-home" class="nav-item active"><i data-lucide="message-square"></i><span class="text-[8px] font-black uppercase tracking-widest">Rooms</span></div>
        <div onclick="window.changeScreen('gist')" id="nav-gist" class="nav-item"><i data-lucide="flame"></i><span class="text-[8px] font-black uppercase tracking-widest">GistMe</span></div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, addDoc, onSnapshot, serverTimestamp, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIG DETECTOR
        const firebaseConfig = (typeof __firebase_config !== 'undefined') ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyCEUDD0iB4iGFSDoC0a3wCXF8PT098Su3w",
            authDomain: "anonymous-messaging-f93c0.firebaseapp.com",
            projectId: "anonymous-messaging-f93c0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = (typeof __app_id !== 'undefined') ? __app_id : 'ghost-room-local';

        let user = null;
        let currentRoomId = null;
        let isGhostMode = false;
        let replyingTo = null;
        let pendingImage = null;

        lucide.createIcons();

        // AUTH
        onAuthStateChanged(auth, (u) => {
            if (u) {
                user = u;
                document.getElementById('user-id-display').textContent = `ID: ${u.uid.substring(0,8)}`;
                loadHistory();
                loadGists();
                checkHash();
            } else {
                signInAnonymously(auth);
            }
        });

        // HASH NAVIGATION
        const checkHash = () => {
            const hash = window.location.hash.slice(1);
            if (hash) initChat(hash);
            else window.changeScreen('home');
        };
        window.onhashchange = checkHash;

        // ROOM LOGIC
        const createRoom = async (type) => {
            if(!user) return;
            const id = type === 'community' ? 'community' : Math.random().toString(36).substring(2, 10);
            const roomPath = ['artifacts', appId, 'public', 'data', 'rooms', id];
            await setDoc(doc(db, ...roomPath), { type, createdAt: serverTimestamp() }, { merge: true });
            
            const historyPath = ['artifacts', appId, 'users', user.uid, 'history', id];
            await setDoc(doc(db, ...historyPath), { roomId: id, type, timestamp: Date.now() });
            window.location.hash = id;
        };

        const loadHistory = () => {
            const histRef = collection(db, 'artifacts', appId, 'users', user.uid, 'history');
            onSnapshot(histRef, (snap) => {
                const container = document.getElementById('history-container');
                container.innerHTML = '';
                snap.docs.sort((a,b) => b.data().timestamp - a.data().timestamp).forEach(d => {
                    const data = d.data();
                    const el = document.createElement('div');
                    el.className = 'card p-5 flex justify-between items-center cursor-pointer mb-2';
                    el.onclick = () => window.location.hash = data.roomId;
                    el.innerHTML = `<div class="flex items-center gap-4"><div class="w-2 h-2 rounded-full ${data.type === 'private' ? 'bg-pink-500' : 'bg-orange-500'}"></div>
                        <div><div class="font-bold text-sm">Room #${data.roomId}</div><div class="text-[9px] text-white/20 uppercase font-black">${data.type}</div></div></div>
                        <i data-lucide="chevron-right" size="16" class="text-white/10"></i>`;
                    container.appendChild(el);
                });
                lucide.createIcons();
            });
        };

        // CHAT LOGIC
        let unsubChat = null;
        const initChat = (roomId) => {
            currentRoomId = roomId;
            window.changeScreen('chat');
            document.getElementById('chat-subtitle').textContent = `#${roomId}`;
            const msgRef = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId, 'messages');
            
            if (unsubChat) unsubChat();
            unsubChat = onSnapshot(msgRef, (snap) => {
                const container = document.getElementById('chat-messages');
                container.innerHTML = '';
                const msgs = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => (a.createdAt?.toMillis() || 0) - (b.createdAt?.toMillis() || 0));
                
                msgs.forEach(m => {
                    const isMe = m.sender === user.uid;
                    const isBurned = m.isGhost && m.viewedBy?.includes(user.uid);
                    const div = document.createElement('div');
                    div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
                    div.innerHTML = `
                        ${m.replyTo ? `<div class="text-[9px] text-white/20 mb-1 px-2 italic">Replying to: ${m.replyTo.text.substring(0,15)}...</div>` : ''}
                        <div class="msg-bubble ${isMe ? 'bg-pink-600 rounded-br-none' : 'bg-white/5 border border-white/10 rounded-bl-none'} 
                             ${m.isGhost && !isBurned ? 'msg-ghost' : ''} ${isBurned ? 'msg-burned' : ''}">
                            ${isBurned ? 'VANISHED' : m.text}
                        </div>`;
                    
                    div.onclick = () => {
                        if (m.isGhost && !isBurned) revealGhost(m.id, m.viewedBy || []);
                        else setReply(m);
                    };
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            });
        };

        const revealGhost = async (id, viewedBy) => {
            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId, 'messages', id);
            await updateDoc(ref, { viewedBy: [...viewedBy, user.uid] });
        };

        const setReply = (m) => {
            replyingTo = m;
            document.getElementById('reply-text').textContent = `Replying to: ${m.text}`;
            document.getElementById('reply-preview').classList.remove('hidden');
        };

        // GIST LOGIC
        const loadGists = () => {
            const gistRef = collection(db, 'artifacts', appId, 'public', 'data', 'gists');
            onSnapshot(gistRef, (snap) => {
                const container = document.getElementById('gist-feed');
                container.innerHTML = '';
                snap.docs.map(d => d.data()).sort((a,b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0)).forEach(g => {
                    const el = document.createElement('div');
                    el.className = 'card p-6 mb-4';
                    el.innerHTML = `<div class="flex items-center gap-3 mb-4"><div class="w-8 h-8 rounded-full bg-gradient-to-tr from-pink-500 to-indigo-600"></div><div class="text-[9px] font-black uppercase text-white/40 tracking-widest">anon_${g.sender?.substring(0,4)}</div></div>
                        <p class="text-sm text-white/80 leading-relaxed mb-4">${g.text}</p>
                        ${g.image ? `<img src="${g.image}" class="w-full h-auto rounded-2xl border border-white/10 mb-4">` : ''}`;
                    container.appendChild(el);
                });
                lucide.createIcons();
            });
        };

        // BIND EVENTS
        document.getElementById('btn-create-private').onclick = () => createRoom('private');
        document.getElementById('btn-create-community').onclick = () => createRoom('community');
        document.getElementById('btn-ghost').onclick = () => {
            isGhostMode = !isGhostMode;
            document.getElementById('btn-ghost').classList.toggle('text-pink-500', isGhostMode);
        };
        document.getElementById('btn-cancel-reply').onclick = () => {
            replyingTo = null;
            document.getElementById('reply-preview').classList.add('hidden');
        };
        document.getElementById('btn-copy-link').onclick = () => {
            navigator.clipboard.writeText(window.location.href);
            alert('Copied!');
        };
        document.getElementById('btn-add-photo').onclick = () => document.getElementById('gist-file-input').click();
        document.getElementById('gist-file-input').onchange = (e) => {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    pendingImage = ev.target.result;
                    document.getElementById('gist-img-preview').src = pendingImage;
                    document.getElementById('gist-img-preview-container').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        };
        document.getElementById('btn-clear-img').onclick = () => {
            pendingImage = null;
            document.getElementById('gist-img-preview-container').classList.add('hidden');
        };

        document.getElementById('btn-submit-gist').onclick = async () => {
            const text = document.getElementById('gist-text-input').value.trim();
            if(!text && !pendingImage) return;
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'gists'), {
                text, image: pendingImage, sender: user.uid, createdAt: serverTimestamp()
            });
            document.getElementById('gist-text-input').value = '';
            pendingImage = null;
            document.getElementById('gist-img-preview-container').classList.add('hidden');
            window.closeGistModal();
        };

        document.getElementById('chat-form').onsubmit = async (e) => {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !user) return;
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId, 'messages'), {
                text, sender: user.uid, createdAt: serverTimestamp(), isGhost: isGhostMode, viewedBy: [],
                replyTo: replyingTo ? { id: replyingTo.id, text: replyingTo.text } : null
            });
            input.value = '';
            replyingTo = null;
            document.getElementById('reply-preview').classList.add('hidden');
        };
    </script>
</body>
</html>
