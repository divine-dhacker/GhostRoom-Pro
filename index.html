<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ghost Rooms Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg: #0a0a0a; --accent: #ff4d6d; --text: #ffffff; }
        body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .ghost-shimmer { background: linear-gradient(90deg, #333 25%, #ff4d6d 50%, #333 75%); background-size: 200% 100%; animation: shimmer 2.5s infinite linear; -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: blur(4px); transition: filter 0.3s; }
        .ghost-shimmer:hover { filter: blur(0px); }
        .timestamp-info { font-size: 10px; max-height: 0; opacity: 0; overflow: hidden; transition: all 0.4s; }
        .timestamp-info.visible { max-height: 20px; opacity: 1; margin-top: 4px; }
        .msg-bubble { transition: transform 0.2s; max-width: 85%; }
        .btn-loading { pointer-events: none; opacity: 0.7; }
        .spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header id="topBar" class="z-50 border-b border-white/5 bg-black/80 backdrop-blur-lg flex flex-col items-center pt-3 pb-2">
        <div class="flex items-center gap-2">
            <span id="roomIcon" class="text-lg">👻</span>
            <h1 id="roomNameDisplay" class="font-bold text-sm tracking-wide uppercase">Ghost Room</h1>
        </div>
        <div id="statusRotator" class="h-4 overflow-hidden mt-1 flex justify-center w-full">
            <span id="statusText" class="text-[10px] text-zinc-500 uppercase tracking-widest">Initializing...</span>
        </div>
    </header>

    <main id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-3 pb-32"></main>

    <footer class="fixed bottom-0 left-0 right-0 bg-black/90 border-t border-white/5 p-3 safe-bottom z-50">
        <div class="flex items-center gap-3">
            <label class="cursor-pointer text-zinc-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                <input type="file" id="mediaInput" class="hidden" accept="image/*,video/*">
            </label>
            <div class="flex-1 bg-zinc-900 rounded-2xl flex items-center px-4 py-2 gap-2 border border-white/5">
                <input type="text" id="mainInput" placeholder="Whisper into the void..." class="bg-transparent flex-1 outline-none text-sm text-white">
                <button id="ghostToggle" class="text-zinc-500 hover:text-[#ff4d6d]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10H12V2Z"/><path d="M12 12L2.1 12"/><path d="M12 12V22"/></svg>
                </button>
            </div>
            <button id="sendBtn" class="bg-[#ff4d6d] p-2.5 rounded-full text-white shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            </button>
        </div>
    </footer>

    <div id="homeOverlay" class="fixed inset-0 z-[100] bg-black flex flex-col items-center justify-center p-8 transition-opacity duration-500">
        <h2 class="text-4xl font-thin tracking-[1em] mb-2">GHOST</h2>
        <p class="text-zinc-500 text-xs tracking-widest mb-12">WIPES EVERY 24 HOURS</p>
        <div class="w-full max-w-xs space-y-4">
            <button onclick="openCreateSheet('private')" class="w-full py-4 rounded-xl border border-white/10 text-sm">PRIVATE VOID</button>
            <button onclick="openCreateSheet('community')" class="w-full py-4 rounded-xl bg-[#ff4d6d] text-white font-bold">COMMUNITY</button>
        </div>
    </div>

    <div id="bottomSheet" class="fixed inset-0 z-[110] hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeSheet()"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-[#111] rounded-t-[32px] p-8 space-y-6 border-t border-white/5 animate-[slideUp_0.3s]">
            <input type="text" id="newRoomName" placeholder="Room Name..." class="w-full bg-zinc-900 border border-white/5 rounded-2xl p-4 text-white outline-none">
            <button id="finalCreateBtn" onclick="processCreate()" class="w-full py-4 bg-[#ff4d6d] rounded-2xl text-white font-bold flex justify-center items-center">
                <span id="btnText">CONSTRUCT ROOM</span>
                <div id="btnLoader" class="hidden spinner"></div>
            </button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCEUDD0iB4iGFSDoC0a3wCXF8PT098Su3w",
        authDomain: "anonymous-messaging-f93c0.firebaseapp.com",
        projectId: "anonymous-messaging-f93c0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let user = null, currentRoom = null, ghostMode = false;

    signInAnonymously(auth).then(() => {
        onAuthStateChanged(auth, (u) => {
            if (u) { user = u; const rid = new URLSearchParams(window.location.search).get('room'); if (rid) joinRoom(rid); }
        });
    });

    window.openCreateSheet = (type) => { document.getElementById('bottomSheet').classList.remove('hidden'); };
    window.closeSheet = () => document.getElementById('bottomSheet').classList.add('hidden');

    window.processCreate = async () => {
        const name = document.getElementById('newRoomName').value.trim();
        if (!name || !user) return;
        document.getElementById('finalCreateBtn').classList.add('btn-loading');
        const docRef = await addDoc(collection(db, "rooms"), {
            name, creator: user.uid, createdAt: serverTimestamp(),
            expiresAt: new Date(Date.now() + (24 * 60 * 60 * 1000)) // 24H LIFE
        });
        window.history.pushState({}, '', `?room=${docRef.id}`);
        joinRoom(docRef.id);
    };

    async function joinRoom(rid) {
        const snap = await getDoc(doc(db, "rooms", rid));
        if (!snap.exists()) return;
        currentRoom = { id: rid, ...snap.data() };
        document.getElementById('homeOverlay').style.display = 'none';
        closeSheet();
        document.getElementById('roomNameDisplay').innerText = currentRoom.name;
        listenMessages(rid);
    }

    function listenMessages(rid) {
        onSnapshot(query(collection(db, "rooms", rid, "messages"), orderBy("createdAt", "asc")), (snap) => {
            snap.docChanges().forEach(change => { if (change.type === "added") renderMessage(change.doc.id, change.doc.data()); });
            const c = document.getElementById('messagesContainer'); c.scrollTop = c.scrollHeight;
        });
    }

    function renderMessage(id, data) {
        if (data.isGhost && data.viewedBy?.includes(user.uid)) return;
        const isMe = data.sender === user.uid;
        const div = document.createElement('div');
        div.id = `msg-${id}`;
        div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
        
        let content = data.type === 'text' ? `<p class="${data.isGhost ? 'ghost-shimmer' : ''}">${data.text}</p>` : 
                      data.type === 'image' ? `<img src="${data.url}" class="rounded-lg max-w-full">` : 
                      `<video src="${data.url}" controls class="rounded-lg max-w-full"></video>`;

        div.innerHTML = `
            <div class="msg-bubble p-3 rounded-2xl ${isMe ? 'bg-[#ff4d6d]' : 'bg-zinc-900'} shadow-xl" onclick="toggleTimestamp('${id}')">
                ${content}
            </div>
            <div id="ts-${id}" class="timestamp-info text-zinc-500">
                ${data.isGhost ? '<span class="text-[#ff4d6d]">Ghost (5s)</span>' : 'Sent'}
            </div>`;
        document.getElementById('messagesContainer').appendChild(div);
    }

    window.toggleTimestamp = async (id) => {
        const el = document.getElementById(`ts-${id}`); el.classList.toggle('visible');
        const msgRef = doc(db, "rooms", currentRoom.id, "messages", id);
        const snap = await getDoc(msgRef);
        if (snap.data().isGhost && !snap.data().viewedBy?.includes(user.uid)) {
            setTimeout(async () => {
                await updateDoc(msgRef, { viewedBy: arrayUnion(user.uid) });
                document.getElementById(`msg-${id}`)?.remove();
            }, 5000);
        }
    };

    window.toggleGhostMode = () => { ghostMode = !ghostMode; document.getElementById('ghostToggle').classList.toggle('text-[#ff4d6d]', ghostMode); };

    window.sendMessage = async () => {
        const input = document.getElementById('mainInput');
        if (!input.value.trim()) return;
        await addDoc(collection(db, "rooms", currentRoom.id, "messages"), {
            type: 'text', text: input.value, sender: user.uid, createdAt: serverTimestamp(), isGhost: ghostMode, viewedBy: []
        });
        input.value = '';
    };

    document.getElementById('mediaInput').onchange = (e) => {
        const file = e.target.files[0];
        if (!file || file.size > 8500000) return alert("Too large for Firestore (Max 850KB)");
        const reader = new FileReader();
        reader.onload = async (ev) => {
            await addDoc(collection(db, "rooms", currentRoom.id, "messages"), {
                type: file.type.startsWith('image') ? 'image' : 'video', url: ev.target.result, sender: user.uid, createdAt: serverTimestamp(), isGhost: ghostMode, viewedBy: []
            });
        };
        reader.readAsDataURL(file);
    };

    document.getElementById('sendBtn').onclick = window.sendMessage;
    document.getElementById('ghostToggle').onclick = window.toggleGhostMode;
    document.getElementById('mainInput').onkeydown = (e) => e.key === 'Enter' && window.sendMessage();
</script>
</body>
</html>
