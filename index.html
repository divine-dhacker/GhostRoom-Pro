<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Ghost Rooms</title>

<style>
:root {
  --bg: #0a0a0a;
  --accent: #ff4d6d;
  --input-bg: #1a1a1a;
  --text: #ffffff;
  --muted: #888;
  --glass: rgba(255, 255, 255, 0.05);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* --- HEADER --- */
.top-bar {
  padding: 10px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  border-bottom: 1px solid var(--glass);
  background: rgba(10, 10, 10, 0.8);
  backdrop-filter: blur(10px);
  z-index: 100;
}

.room-name { font-weight: 600; font-size: 16px; margin-bottom: 2px; }
.room-status { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

/* --- MESSAGES --- */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-bottom: 120px;
}

.msg-wrap {
  max-width: 85%;
  display: flex;
  flex-direction: column;
  position: relative;
  transition: transform 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
}

.me { align-self: flex-end; align-items: flex-end; }
.them { align-self: flex-start; align-items: flex-start; }

.bubble {
  padding: 12px 16px;
  border-radius: 20px;
  font-size: 15px;
  line-height: 1.4;
  cursor: pointer;
}

.me .bubble { background: var(--accent); color: white; border-bottom-right-radius: 4px; }
.them .bubble { background: var(--input-bg); border-bottom-left-radius: 4px; }

.timestamp {
  font-size: 10px;
  color: var(--muted);
  height: 0;
  opacity: 0;
  transition: all 0.2s ease;
}
.timestamp.show { height: 14px; opacity: 1; margin-top: 4px; }

/* Ghost Effect */
.ghost-text {
  background: linear-gradient(90deg, #444 25%, #888 50%, #444 75%);
  background-size: 200% 100%;
  animation: shimmer 2s infinite;
  color: transparent !important;
  -webkit-background-clip: text;
  background-clip: text;
  filter: blur(4px);
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* --- INPUT --- */
.bottom-container {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: var(--bg);
  padding: 10px 16px calc(15px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--glass);
}

.reply-preview {
  display: none;
  padding: 8px 12px;
  background: var(--glass);
  border-left: 3px solid var(--accent);
  margin-bottom: 8px;
  font-size: 12px;
  border-radius: 4px;
}

.input-row { display: flex; align-items: center; gap: 10px; }
.input-field {
  flex: 1;
  background: var(--input-bg);
  border-radius: 30px;
  padding: 2px 16px;
  display: flex;
  align-items: center;
  border: 1px solid var(--glass);
}

.input-field input {
  flex: 1;
  background: none;
  border: none;
  color: white;
  padding: 12px 0;
  font-size: 16px;
  outline: none;
}

.send-btn {
  width: 45px; height: 45px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  display: flex; align-items: center; justify-content: center;
}

/* --- SHEETS --- */
.sheet-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  display: none;
  z-index: 1000;
  align-items: flex-end;
}
.bottom-sheet {
  width: 100%;
  background: #161616;
  border-radius: 25px 25px 0 0;
  padding: 30px 24px;
  transform: translateY(100%);
  transition: transform 0.3s ease;
}
.sheet-overlay.active { display: flex; }
.sheet-overlay.active .bottom-sheet { transform: translateY(0); }

.loader {
  width: 20px; height: 20px;
  border: 2px solid rgba(255,255,255,0.2);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="homeScreen" style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;">
  <h1 style="letter-spacing:10px; font-weight:200; margin-bottom:5px;">GHOSTROOM</h1>
  <p style="color:var(--muted); font-size:12px; margin-bottom:50px;">ANONYMOUS VOID</p>
  
  <div style="width:80%; display:flex; flex-direction:column; gap:15px;">
    <button onclick="openSheet('private')" style="background:var(--input-bg); color:white; border:1px solid var(--glass); padding:18px; border-radius:15px; font-weight:600;">PRIVATE VOID (2 PERS.)</button>
    <button onclick="openSheet('community')" style="background:var(--accent); color:white; border:none; padding:18px; border-radius:15px; font-weight:600;">COMMUNITY ROOM</button>
  </div>
</div>

<div id="chatScreen" style="display:none; flex:1; flex-direction:column;">
  <div class="top-bar" id="topBar">
    <div class="room-name" id="displayRoomName">Void</div>
    <div class="room-status" id="displayRoomInfo">Tap to Share 🔗</div>
  </div>

  <div id="messages"></div>

  <div class="bottom-container">
    <div id="replyPreview" class="reply-preview">
      <span id="replyText">Replying...</span>
      <span style="float:right" onclick="cancelReply()">✕</span>
    </div>
    <div class="input-row">
      <button class="icon-btn" style="background:none; border:none; font-size:24px; color:var(--muted)" onclick="triggerMedia()">＋</button>
      <div class="input-field">
        <input type="text" id="msgInput" placeholder="Whisper into the void...">
        <button id="ghostBtn" style="background:none; border:none; font-size:20px; filter:grayscale(1)" onclick="toggleGhost()">👻</button>
      </div>
      <button id="sendBtn" class="send-btn">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<div id="createSheet" class="sheet-overlay">
  <div class="bottom-sheet">
    <h2 id="sheetTitle" style="margin-top:0">Room Name</h2>
    <input type="text" id="roomNameInput" placeholder="Enter name..." style="width:100%; background:var(--input-bg); border:1px solid var(--glass); padding:15px; border-radius:12px; color:white; margin:20px 0;">
    <button id="confirmCreateBtn" style="width:100%; padding:18px; border-radius:12px; border:none; background:var(--accent); color:white; font-weight:bold;">LAUNCH</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCEUDD0iB4iGFSDoC0a3wCXF8PT098Su3w",
  authDomain: "anonymous-messaging-f93c0.firebaseapp.com",
  projectId: "anonymous-messaging-f93c0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser, currentRoomId, activeRoomType;
let isGhostMode = false;
let replyId = null;

// --- AUTH & AUTO-JOIN ---
signInAnonymously(auth).then(async (user) => {
  currentUser = user.user.uid;
  const urlParams = new URLSearchParams(window.location.search);
  const rid = urlParams.get('room');
  if (rid) joinRoom(rid);
});

// --- NAVIGATION ---
window.openSheet = (type) => {
  activeRoomType = type;
  document.getElementById('sheetTitle').innerText = type === 'private' ? 'Create Private Void' : 'Create Community';
  document.getElementById('createSheet').classList.add('active');
};

document.getElementById('confirmCreateBtn').onclick = async function() {
  const name = document.getElementById('roomNameInput').value.trim() || "The Void";
  this.disabled = true;
  this.innerHTML = '<div class="loader" style="margin:auto"></div>';

  const roomRef = await addDoc(collection(db, "rooms"), {
    name,
    type: activeRoomType,
    creator: currentUser,
    participants: [currentUser],
    createdAt: serverTimestamp()
  });

  window.history.pushState({}, '', `?room=${roomRef.id}`);
  location.reload(); // Refresh once to initialize chat with new ID
};

async function joinRoom(rid) {
  const rSnap = await getDoc(doc(db, "rooms", rid));
  if (!rSnap.exists()) return;
  
  const data = rSnap.data();
  if (data.type === 'private' && data.participants.length >= 2 && !data.participants.includes(currentUser)) {
    alert("This Private Void is full (Max 2).");
    window.history.pushState({}, '', window.location.pathname);
    return;
  }

  await updateDoc(doc(db, "rooms", rid), { participants: arrayUnion(currentUser) });
  currentRoomId = rid;
  startChat(data.name);
}

// --- CHAT ENGINE ---
function startChat(name) {
  document.getElementById('homeScreen').style.display = 'none';
  document.getElementById('chatScreen').style.display = 'flex';
  document.getElementById('displayRoomName').innerText = name;

  const q = query(collection(db, "rooms", currentRoomId, "messages"), orderBy("createdAt", "asc"));
  onSnapshot(q, (snap) => {
    snap.docChanges().forEach(change => {
      if (change.type === "added") renderMsg(change.doc.id, change.doc.data());
    });
    const m = document.getElementById('messages');
    m.scrollTop = m.scrollHeight;
  });
}

function renderMsg(id, data) {
  const isMe = data.sender === currentUser;
  const wrap = document.createElement('div');
  wrap.className = `msg-wrap ${isMe ? 'me' : 'them'}`;
  
  const bubble = document.createElement('div');
  bubble.className = `bubble ${data.isGhost ? 'ghost-text' : ''}`;
  bubble.innerText = data.text;

  const ts = document.createElement('div');
  ts.className = 'timestamp';
  ts.innerText = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : "Just now";

  bubble.onclick = () => {
    if (data.isGhost && !isMe) {
      bubble.classList.remove('ghost-text');
      setTimeout(() => wrap.style.opacity = '0', 3000);
    }
    ts.classList.toggle('show');
  };

  // Swipe logic
  let startX = 0;
  wrap.addEventListener('touchstart', (e) => startX = e.touches[0].clientX);
  wrap.addEventListener('touchmove', (e) => {
    let x = e.touches[0].clientX - startX;
    if (x > 50) {
      wrap.style.transform = "translateX(50px)";
      setupReply(data.text, id);
    }
  });
  wrap.addEventListener('touchend', () => wrap.style.transform = "translateX(0)");

  wrap.append(bubble, ts);
  document.getElementById('messages').append(wrap);
}

// --- INPUT LOGIC ---
window.toggleGhost = () => {
  isGhostMode = !isGhostMode;
  document.getElementById('ghostBtn').style.filter = isGhostMode ? "none" : "grayscale(1)";
};

document.getElementById('sendBtn').onclick = async () => {
  const text = document.getElementById('msgInput').value.trim();
  if (!text) return;

  document.getElementById('msgInput').value = '';
  await addDoc(collection(db, "rooms", currentRoomId, "messages"), {
    text,
    sender: currentUser,
    isGhost: isGhostMode,
    replyTo: replyId,
    createdAt: serverTimestamp()
  });
  cancelReply();
};

function setupReply(text, id) {
  replyId = id;
  document.getElementById('replyPreview').style.display = 'block';
  document.getElementById('replyText').innerText = `Replying: ${text.substring(0,25)}...`;
}

window.cancelReply = () => {
  replyId = null;
  document.getElementById('replyPreview').style.display = 'none';
};

// --- GESTURES ---
let lastTap = 0;
document.getElementById('topBar').onclick = () => {
  const now = Date.now();
  if (now - lastTap < 300) {
    navigator.share({ title: 'Join Void', url: window.location.href });
  } else {
    const info = document.getElementById('displayRoomInfo');
    info.innerText = "Link Copied!";
    navigator.clipboard.writeText(window.location.href);
    setTimeout(() => info.innerText = "Tap to Share 🔗", 2000);
  }
  lastTap = now;
};
</script>
</body>
</html>
